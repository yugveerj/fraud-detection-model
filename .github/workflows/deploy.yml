name: Deploy scoring image + demo

# Owner-triggered only, gated on the `production` environment (add a required reviewer
# there to enforce the deploy gate, SPEC Section 5).
#
# Division of labour (matches the least-privilege OIDC role and the live-AWS boundary):
#   * The OWNER provisions/updates infrastructure with `terraform apply` LOCALLY
#     (admin creds), per infra/README.md, and sets the repo vars/secrets below.
#   * This workflow only builds+pushes the image and updates the Lambda CODE + the
#     demo — exactly what the scoped deploy role (ECR push + lambda:UpdateFunctionCode)
#     can do. It never runs `terraform apply` (no admin perms, no shared state on CI).
#
# Repo config (set after the owner's local `terraform apply`):
#   secret AWS_DEPLOY_ROLE_ARN   = terraform output deploy_role_arn
#   var    AWS_REGION            = us-west-2
#   var    ECR_REPOSITORY_URL    = terraform output ecr_repository_url
#   var    LAMBDA_FUNCTION_NAME  = terraform output lambda_function_name
#   var    API_BASE             = terraform output api_endpoint
on:
  workflow_dispatch:
    inputs:
      data_source:
        description: "auto (real if present) | synthetic"
        default: "synthetic"
        type: choice
        options: [synthetic, auto]

permissions:
  id-token: write # assume the AWS deploy role via OIDC
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}

      - name: Set up QEMU (arm64 cross-build on x86 runners)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12

      - name: Build serving bundle
        run: |
          uv sync --group models
          uv run python -m serving.artifact --source ${{ github.event.inputs.data_source }}

      - name: Build, tag, push image
        id: image
        env:
          ECR_URL: ${{ vars.ECR_REPOSITORY_URL }}
        run: |
          TAG="sha-${GITHUB_SHA::12}"
          aws ecr get-login-password --region "${{ vars.AWS_REGION || 'us-west-2' }}" \
            | docker login --username AWS --password-stdin "${ECR_URL%/*}"
          docker build --platform linux/arm64 -t "$ECR_URL:$TAG" -t "$ECR_URL:latest" .
          docker push "$ECR_URL:$TAG"
          docker push "$ECR_URL:latest"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Update the Lambda to the new image
        env:
          FN: ${{ vars.LAMBDA_FUNCTION_NAME }}
          ECR_URL: ${{ vars.ECR_REPOSITORY_URL }}
        run: |
          aws lambda update-function-code --function-name "$FN" \
            --image-uri "$ECR_URL:${{ steps.image.outputs.tag }}" >/dev/null
          aws lambda wait function-updated --function-name "$FN"

      - name: Wire the API URL into the demo
        run: |
          cp artifacts/serving/presets.json web/presets.json
          sed -i "s#__FRAUD_API_BASE__#${{ vars.API_BASE }}#g" web/config.js

      - name: Publish demo to gh-pages (preserves /monitoring/)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          keep_files: true

      - name: Smoke-test the live endpoint
        run: |
          curl -fsS "${{ vars.API_BASE }}/healthz" | tee /dev/stderr | grep -q '"status": *"ok"'
