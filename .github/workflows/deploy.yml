name: Deploy scoring API + demo

# Owner-triggered only. The `production` environment should have a required-reviewer
# protection rule so the first public deploy is gated (SPEC Section 5 deploy gate).
# The agent never runs this; it authors it. Apply happens here via GitHub OIDC.
on:
  workflow_dispatch:
    inputs:
      data_source:
        description: "auto (real if present) | synthetic"
        default: "synthetic"
        type: choice
        options: [synthetic, auto]

permissions:
  id-token: write # assume the AWS deploy role via OIDC
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production # add a required reviewer here to enforce the deploy gate
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12

      - name: Build serving bundle
        run: |
          uv sync --group models
          uv run python -m serving.artifact --source ${{ github.event.inputs.data_source }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: infra
        run: terraform init -input=false

      - name: Create ECR repository first (image must exist before the Lambda)
        working-directory: infra
        run: terraform apply -input=false -auto-approve -target=aws_ecr_repository.this

      - name: Build, tag, push image
        id: image
        run: |
          ECR_URL=$(terraform -chdir=infra output -raw ecr_repository_url)
          TAG="sha-${GITHUB_SHA::12}"
          aws ecr get-login-password --region "${{ vars.AWS_REGION || 'us-west-2' }}" \
            | docker login --username AWS --password-stdin "${ECR_URL%/*}"
          docker build -t "$ECR_URL:$TAG" -t "$ECR_URL:latest" .
          docker push "$ECR_URL:$TAG"
          docker push "$ECR_URL:latest"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Terraform apply (full stack)
        working-directory: infra
        run: terraform apply -input=false -auto-approve -var="image_tag=${{ steps.image.outputs.tag }}"

      - name: Point the Lambda at the new image
        run: |
          FN=$(terraform -chdir=infra output -raw lambda_function_name)
          ECR_URL=$(terraform -chdir=infra output -raw ecr_repository_url)
          aws lambda update-function-code --function-name "$FN" \
            --image-uri "$ECR_URL:${{ steps.image.outputs.tag }}" >/dev/null
          aws lambda wait function-updated --function-name "$FN"

      - name: Wire the API URL into the demo + publish to Pages
        run: |
          API=$(terraform -chdir=infra output -raw api_endpoint)
          echo "API endpoint: $API"
          cp artifacts/serving/presets.json web/presets.json
          sed -i "s#__FRAUD_API_BASE__#$API#g" web/config.js

      - name: Publish demo to gh-pages (preserves /monitoring/)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          keep_files: true

      - name: Smoke-test the live endpoint
        run: |
          API=$(terraform -chdir=infra output -raw api_endpoint)
          curl -fsS "$API/healthz" | tee /dev/stderr | grep -q '"status": *"ok"'
