name: Drift monitoring (replayed)

# Replays one holdout slice per run as a simulated week, publishes Evidently + PSI to
# GitHub Pages /monitoring/, and opens a GitHub Issue on a breach (SPEC Section 6).
# Daily cadence to accrue history faster (the stream freezes when exhausted). Every
# page is labelled a replayed simulation on a static public dataset.
on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch:
    inputs:
      reset:
        description: "restart the replay stream"
        type: boolean
        default: false

permissions:
  contents: write # publish to gh-pages
  issues: write # open breach issues

concurrency:
  group: monitoring
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore existing /monitoring state from gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: _pages
        continue-on-error: true # gh-pages may not exist on the first run

      - name: Seed working site from published state
        run: |
          mkdir -p site
          [ -d _pages/monitoring ] && cp -r _pages/monitoring site/monitoring || true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12

      - name: Fetch real IEEE-CIS data (Kaggle token from secret)
        env:
          KAGGLE_ACCESS_TOKEN: ${{ secrets.KAGGLE_ACCESS_TOKEN }}
        run: |
          uv sync --group models --group monitoring --group data
          mkdir -p ~/.kaggle
          printf '%s' "$KAGGLE_ACCESS_TOKEN" > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token
          uv run python -m pipeline.fetch_data

      - name: Replay the next week (real holdout)
        run: |
          RESET=""
          [ "${{ github.event.inputs.reset }}" = "true" ] && RESET="--reset"
          uv run python -m monitoring.replay_week --source real --n-batches 20 --out site/monitoring $RESET

      - name: Publish to gh-pages /monitoring/ (preserves the demo)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site/monitoring
          destination_dir: monitoring
          keep_files: true

      - name: Open a GitHub Issue on breach
        if: hashFiles('site/monitoring/breach.json') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const b = JSON.parse(fs.readFileSync('site/monitoring/breach.json', 'utf8'));
            // Stable title (no week number) so repeat breaches dedupe onto one Issue.
            const title = 'Drift monitoring breach';
            const body = [
              `**Breach on simulated week ${String(b.week).padStart(2, '0')}** — replayed on the real IEEE-CIS holdout.`,
              '',
              ...b.breaches.map((x) => `- ${x}`),
              '',
              `Run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId} · /monitoring/ on Pages.`,
            ].join('\n');
            try {
              await github.rest.issues.createLabel({ owner, repo, name: 'drift', color: 'b60205' });
            } catch (e) { /* exists */ }
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'drift' });
            const hit = open.data.find((i) => i.title === title);
            if (hit) {
              await github.rest.issues.createComment({ owner, repo, issue_number: hit.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: ['drift'] });
            }
