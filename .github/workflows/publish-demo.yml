name: Publish demo (pages only)

# Publishes the committed web/ directory to gh-pages exactly as tested — no serving-bundle
# rebuild, no Lambda touch. The numbers in web/metrics.json and web/curves/*.json are
# CI-drift-guarded against the committed artifacts (tests/test_web_metrics.py,
# tests/test_web_curves.py), so publishing the committed files IS publishing fresh data.
# Use deploy.yml when the scoring image itself must change.
on:
  workflow_dispatch:

permissions:
  contents: write # publish to gh-pages

concurrency:
  group: pages-demo
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wire the live API URL into the demo
        run: |
          sed -i "s#__FRAUD_API_BASE__#${{ vars.API_BASE }}#g" web/config.js
          grep -q "${{ vars.API_BASE }}" web/config.js

      - name: Publish web/ to gh-pages (preserves /monitoring/)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          keep_files: true

      - name: Smoke-check the published page
        run: |
          # Pages CDN propagation can take a couple of minutes; retry before failing.
          for i in $(seq 1 12); do
            if curl -fsS "${{ vars.DEMO_URL }}?smoke=$i" | grep -q "frozen threshold"; then
              echo "new demo live (attempt $i)"; exit 0
            fi
            echo "attempt $i: not propagated yet"; sleep 15
          done
          echo "page did not propagate in time" >&2; exit 1
